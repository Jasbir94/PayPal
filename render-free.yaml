# Separate free preview service. The existing render.yaml remains unchanged,
# including its persistent disk and its existing deployment/data.
services:
  - type: web
    name: app-shield-api-free
    runtime: docker
    plan: free
    numInstances: 1
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /ready
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: APP_SHIELD_CORS_ORIGINS
        value: https://pay-pal-84xr.vercel.app
