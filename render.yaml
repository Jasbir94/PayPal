services:
  - type: web
    name: app-shield-api
    runtime: python
    plan: 0.5c-512mb
    numInstances: 1
    buildCommand: pip install -r backend/requirements.txt && python -m scripts.initialize_demo
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /ready
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: APP_SHIELD_CORS_ORIGINS
        sync: false
